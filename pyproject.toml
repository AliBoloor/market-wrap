[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "market-wrap"
version = "0.1.0"
description = "Deterministic tooling for the Market Wrap static website"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "Markdown>=3.6,<4",
  "matplotlib>=3.8,<4",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
market-wrap-build = "market_wrap.site:main"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["market_wrap"]
