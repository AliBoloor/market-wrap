[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "market-wrap"
version = "0.1.0"
description = "Automated pre-market market wrap report"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "APScheduler>=3.10,<4",
  "feedparser>=6.0",
  "Jinja2>=3.1",
  "matplotlib>=3.8",
  "numpy>=1.26",
  "pandas>=2.2",
  "PyYAML>=6.0",
  "yfinance>=0.2.54",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
market-wrap = "market_wrap.cli:main"

[tool.setuptools.packages.find]
include = ["market_wrap*"]

[tool.setuptools.package-data]
market_wrap = ["templates/*.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
